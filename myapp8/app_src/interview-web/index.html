<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solvro Interview</title>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: rgba(8, 10, 18, 1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Inter', sans-serif;
      }
      .loader-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #6366f1;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-logo-container {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-logo {
        width: 40px;
        height: 40px;
        object-fit: contain;
        border-radius: 50%;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DlRHjvOW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BarONWUy.css">
  </head>
  <body>
    <div id="initial-loader">
      <div style="position: relative;">
        <div class="loader-circle"></div>
        <div class="loader-logo-container">
          <img src="./logo.png" alt="Solvro" class="loader-logo" />
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 24px;">
        <h2 style="font-size: 20px; font-weight: 800; color: #f0f0f5; margin: 0; letter-spacing: -0.025em;">Loading...</h2>
        <p style="font-size: 14px; font-weight: 500; color: #9090a0; margin: 0;">Preparing your workspace</p>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
