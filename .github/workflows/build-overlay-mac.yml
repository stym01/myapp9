name: Build macOS Native Overlay

on:
  push:
    branches: ['**']
    paths:
      - 'myapp8/app_src/overlay-mac/**'
      - '.github/workflows/build-overlay-mac.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'myapp8/app_src/overlay-mac/**'
      - '.github/workflows/build-overlay-mac.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build universal binary
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/Xcode*.app/Contents/Developer 2>/dev/null | head -5
          xcodebuild -version

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Copy ImGui sources into overlay project
        run: |
          IMGUI_SRC=myapp8/myapp5
          IMGUI_DST=myapp8/app_src/overlay-mac/imgui

          mkdir -p "$IMGUI_DST/backends"

          # Core ImGui files
          cp "$IMGUI_SRC/imgui.cpp"          "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui.h"            "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_internal.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_draw.cpp"     "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_tables.cpp"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_widgets.cpp"  "$IMGUI_DST/"
          cp "$IMGUI_SRC/imconfig.h"         "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_rectpack.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_textedit.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_truetype.h"   "$IMGUI_DST/"

          # Metal + macOS backends
          cp "$IMGUI_SRC/backends/imgui_impl_metal.mm" "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_metal.h"  "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_osx.mm"   "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_osx.h"    "$IMGUI_DST/backends/"

          echo "=== ImGui sources copied ==="
          ls -la "$IMGUI_DST/"
          ls -la "$IMGUI_DST/backends/"

      - name: Build Release (universal)
        working-directory: ./myapp8/app_src/overlay-mac
        run: |
          xcodebuild \
            -project SolvroOverlay.xcodeproj \
            -scheme SolvroOverlay \
            -configuration Release \
            -arch x86_64 -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Locate and verify app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "solvro-overlay.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: solvro-overlay.app not found in DerivedData"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

          echo "--- App bundle contents ---"
          ls -lR "$APP_PATH/Contents/"

          echo "--- Binary architectures ---"
          lipo -info "$APP_PATH/Contents/MacOS/solvro-overlay"

          echo "--- Info.plist ---"
          cat "$APP_PATH/Contents/Info.plist"

          ARCHS=$(lipo -archs "$APP_PATH/Contents/MacOS/solvro-overlay")
          echo "Architectures: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* ]] || [[ "$ARCHS" != *"arm64"* ]]; then
            echo "WARNING: Binary is not universal — got: $ARCHS"
          else
            echo "Universal binary confirmed (x86_64 + arm64)"
          fi

      - name: Stage artifact
        run: |
          mkdir -p staging
          cp -R "${{ steps.locate.outputs.app_path }}" staging/solvro-overlay.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: solvro-overlay-mac
          path: staging/solvro-overlay.app
          if-no-files-found: error
          retention-days: 30
