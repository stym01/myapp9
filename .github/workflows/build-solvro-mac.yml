name: Build Solvro for macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'solvro-mac-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show build environment
        run: |
          echo "=== macOS ==="
          sw_vers
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Node ==="
          node --version
          npm --version

      - name: Copy ImGui sources into overlay project
        run: |
          IMGUI_SRC=myapp7
          IMGUI_DST=myapp8/app_src/overlay-mac/imgui

          mkdir -p "$IMGUI_DST/backends"

          cp "$IMGUI_SRC/imgui.cpp"          "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui.h"            "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_internal.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_draw.cpp"     "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_tables.cpp"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imgui_widgets.cpp"  "$IMGUI_DST/"
          cp "$IMGUI_SRC/imconfig.h"         "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_rectpack.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_textedit.h"   "$IMGUI_DST/"
          cp "$IMGUI_SRC/imstb_truetype.h"   "$IMGUI_DST/"

          cp "$IMGUI_SRC/backends/imgui_impl_metal.mm" "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_metal.h"  "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_osx.mm"   "$IMGUI_DST/backends/"
          cp "$IMGUI_SRC/backends/imgui_impl_osx.h"    "$IMGUI_DST/backends/"

          echo "=== ImGui sources copied ==="
          ls -la "$IMGUI_DST/"

      - name: Build native Mac overlay (Swift/Metal + ImGui)
        working-directory: ./myapp8/app_src/overlay-mac
        run: |
          echo "=== Building solvro-overlay.app (arm64) ==="
          xcodebuild \
            -project SolvroOverlay.xcodeproj \
            -scheme SolvroOverlay \
            -configuration Release \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tail -30

          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "solvro-overlay.app" -type d | head -1)
          echo "Built: $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/solvro-overlay"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
        id: build_overlay

      - name: Copy overlay into overlay-mac-bin
        run: |
          mkdir -p myapp8/app_src/overlay-mac-bin
          cp -R "${{ steps.build_overlay.outputs.app_path }}" myapp8/app_src/overlay-mac-bin/solvro-overlay.app
          echo "=== overlay-mac-bin contents ==="
          ls -la myapp8/app_src/overlay-mac-bin/
          ls -la myapp8/app_src/overlay-mac-bin/solvro-overlay.app/Contents/MacOS/

      - name: Install Electron app dependencies
        working-directory: ./myapp8/app_src
        run: npm install

      - name: Build Solvro.app DMG (electron-builder)
        working-directory: ./myapp8/app_src
        run: |
          echo "=== Building Solvro macOS DMG ==="
          npx electron-builder --mac --arm64 --publish never
          echo ""
          echo "=== Build output ==="
          ls -lh dist/

      - name: Verify overlay is bundled
        run: |
          DMG=$(find myapp8/app_src/dist -name "*.dmg" | head -1)
          echo "DMG: $DMG"

          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/Solvro
          echo "=== DMG contents ==="
          ls -la /Volumes/Solvro/

          APP=$(find /Volumes/Solvro -name "Solvro.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            APP=$(find /Volumes/Solvro -name "*.app" -maxdepth 1 | head -1)
          fi
          echo "App: $APP"

          OVERLAY=$(find "$APP" -name "solvro-overlay.app" -type d | head -1)
          if [ -n "$OVERLAY" ]; then
            echo "Overlay bundled at: $OVERLAY"
            ls -la "$OVERLAY/Contents/MacOS/"
          else
            echo "Overlay NOT found inside app bundle!"
            find "$APP/Contents/Resources" -maxdepth 3 -type d
            hdiutil detach /Volumes/Solvro || true
            exit 1
          fi

          hdiutil detach /Volumes/Solvro || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: solvro-mac-dmg
          path: myapp8/app_src/dist/*.dmg

      - name: Create GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: myapp8/app_src/dist/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
