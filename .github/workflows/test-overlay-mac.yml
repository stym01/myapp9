name: Smoke Test macOS Overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  smoke-test:
    name: Build & Launch Test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode:"
          xcodebuild -version

      - name: Build Release
        working-directory: ./myapp8/app_src/overlay-mac
        run: |
          xcodebuild \
            -project SolvroOverlay.xcodeproj \
            -scheme SolvroOverlay \
            -configuration Release \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tail -5

      - name: Locate app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "solvro-overlay.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/solvro-overlay"

      - name: Create mock token file
        run: |
          mkdir -p ~/Desktop
          echo "mock-test-token-for-ci" > ~/Desktop/solvro-token.txt

      - name: Prepare verification
        run: echo "Will verify overlay z-order from app log output"

      - name: Launch Safari and TextEdit
        run: |
          echo "=== Launching Safari ==="
          open -a Safari https://www.example.com || echo "Safari launch returned non-zero (may still open)"
          sleep 4

          echo "=== Launching TextEdit ==="
          open -a TextEdit || echo "TextEdit launch returned non-zero"
          sleep 3

          echo "=== Apps launched ==="
          ps aux | grep -E "Safari|TextEdit" | grep -v grep || echo "(no matching processes)"

      - name: Launch overlay and verify z-order
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          BINARY="$APP_PATH/Contents/MacOS/solvro-overlay"

          echo "=== Launching overlay app ==="
          "$BINARY" > /tmp/overlay-stdout.log 2> /tmp/overlay-stderr.log &
          APP_PID=$!
          echo "Launched with PID: $APP_PID"
          sleep 6

          echo ""
          echo "=== Process alive check ==="
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ Process $APP_PID is running"
          else
            echo "❌ Process crashed!"
            cat /tmp/overlay-stderr.log
            exit 1
          fi

          echo ""
          echo "=== App stderr log ==="
          cat /tmp/overlay-stderr.log

          echo ""
          echo "========================================================"
          echo "  WINDOW Z-ORDER + STEALTH VERIFICATION"
          echo "========================================================"
          echo ""

          CHECK_EXIT=0

          # Parse the overlay's CGSBridge log line which prints the actual level set
          LEVEL_LINE=$(grep "CGSSetWindowLevel" /tmp/overlay-stderr.log || true)
          echo "Raw CGSBridge log: $LEVEL_LINE"

          if [ -n "$LEVEL_LINE" ]; then
            # Format: ... [CGSBridge] CGSSetWindowLevel(connID, windowID, level) = result
            # Extract the level from inside the parentheses (third comma-separated value)
            PARENS=$(echo "$LEVEL_LINE" | grep -oE 'CGSSetWindowLevel\([^)]+\)' | grep -oE '\([^)]+\)' | tr -d '()')
            OVERLAY_LEVEL=$(echo "$PARENS" | tr ',' '\n' | sed -n '3p' | tr -d ' ')
            echo ""
            echo "  Overlay window level: $OVERLAY_LEVEL"
            echo ""
            echo "  ┌─────────────────────────────────────────────────┐"
            echo "  │  macOS Window Level Hierarchy                   │"
            echo "  ├─────────────────────────────────────────────────┤"
            echo "  │  Normal apps (Safari, Chrome, Firefox):  0     │"
            echo "  │  Floating panels:                        3     │"
            echo "  │  Torn-off menus:                         3     │"
            echo "  │  Modal panels:                           8     │"
            echo "  │  Utility windows:                        19    │"
            echo "  │  Dock:                                   20    │"
            echo "  │  Menu bar (main):                        24    │"
            echo "  │  Status bar items:                       25    │"
            echo "  │  Screen saver / SEB:                     1000  │"
            echo "  │  kCGMaximumWindowLevel:           2147483631   │"
            echo "  │  ➤ OUR OVERLAY:                  $OVERLAY_LEVEL   │"
            echo "  └─────────────────────────────────────────────────┘"
            echo ""

            if [ "$OVERLAY_LEVEL" -gt 0 ] 2>/dev/null; then
              echo "  ✅ PASS: Overlay ($OVERLAY_LEVEL) > Normal apps like Safari/Chrome/Firefox (0)"
            else
              echo "  ❌ FAIL: Overlay level not above normal apps"
              CHECK_EXIT=1
            fi

            if [ "$OVERLAY_LEVEL" -gt 1000 ] 2>/dev/null; then
              echo "  ✅ PASS: Overlay ($OVERLAY_LEVEL) > Safe Exam Browser / SEB (1000)"
            else
              echo "  ❌ FAIL: Overlay would NOT survive SEB (level 1000)"
              CHECK_EXIT=1
            fi

            if [ "$OVERLAY_LEVEL" -gt 2147483631 ] 2>/dev/null; then
              echo "  ✅ PASS: Overlay ($OVERLAY_LEVEL) > kCGMaximumWindowLevel (2147483631)"
              echo "         → Renders ABOVE every possible macOS window including SEB"
            fi
          else
            echo "  ❌ No CGSSetWindowLevel log found — window level not verified"
            CHECK_EXIT=1
          fi

          echo ""
          echo "========================================================"
          echo "  STEALTH VERIFICATION"
          echo "========================================================"
          echo ""

          STEALTH_LINE=$(grep "full stealth applied" /tmp/overlay-stderr.log || true)
          if [ -n "$STEALTH_LINE" ]; then
            echo "  ✅ PASS: Full stealth applied (window hidden from screen capture)"
            echo "    Log: $(echo "$STEALTH_LINE" | sed 's/.*\] //')"
          else
            echo "  ❌ FAIL: No stealth confirmation in logs"
            CHECK_EXIT=1
          fi

          SHARING_LINE=$(grep "OverlayPanel.*stealth" /tmp/overlay-stderr.log || true)
          if [ -n "$SHARING_LINE" ]; then
            echo "  ✅ PASS: Window sharing set to none (invisible to screen recording)"
          fi

          echo ""
          echo "========================================================"
          echo "  CO-EXISTENCE CHECK (overlay + other apps)"
          echo "========================================================"
          echo ""

          echo "  Apps running alongside the overlay:"
          SAFARI_PID=$(pgrep Safari || true)
          TEXTEDIT_PID=$(pgrep TextEdit || true)
          if [ -n "$SAFARI_PID" ]; then
            echo "  ✅ Safari is running (PID: $SAFARI_PID)"
          else
            echo "  ⚠️  Safari not detected (may have closed)"
          fi
          if [ -n "$TEXTEDIT_PID" ]; then
            echo "  ✅ TextEdit is running (PID: $TEXTEDIT_PID)"
          else
            echo "  ⚠️  TextEdit not detected (may have closed)"
          fi

          echo ""
          echo "  Overlay process:"
          ps aux | grep solvro-overlay | grep -v grep || true

          echo ""
          echo "=== Taking screenshot ==="
          screencapture -x /tmp/overlay-screenshot.png 2>/dev/null && echo "Screenshot saved" || echo "Headless — no screenshot"

          echo ""
          echo "=== Cleanup ==="
          kill $APP_PID 2>/dev/null || true
          sleep 1
          killall Safari 2>/dev/null || true
          killall TextEdit 2>/dev/null || true

          if [ $CHECK_EXIT -ne 0 ]; then
            echo "❌ Window check failed"
            exit 1
          fi

          echo ""
          echo "✅ All tests passed — overlay launches on top of browsers and survives SEB-level windows"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-screenshot
          path: /tmp/overlay-screenshot.png
          if-no-files-found: ignore
