name: Smoke Test macOS Overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  smoke-test:
    name: Build & Launch Test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode:"
          xcodebuild -version

      - name: Build Release
        working-directory: ./myapp8/app_src/overlay-mac
        run: |
          xcodebuild \
            -project SolvroOverlay.xcodeproj \
            -scheme SolvroOverlay \
            -configuration Release \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tail -5

      - name: Locate app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "solvro-overlay.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/solvro-overlay"

      - name: Create mock token file
        run: |
          mkdir -p ~/Desktop
          echo "mock-test-token-for-ci" > ~/Desktop/solvro-token.txt

      - name: Build window-level checker tool
        run: |
          cat > /tmp/check_windows.swift << 'SWIFTEOF'
          import Cocoa
          import CoreGraphics

          guard let windowList = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] else {
              print("⚠️  CGWindowListCopyWindowInfo returned nil — likely no screen recording permission on CI")
              print("Falling back to log-based verification...")
              exit(2)
          }

          let windows = windowList
          print("Total on-screen windows: \(windows.count)")
          print("")
          print(String(format: "%-28s %-35s %-12s %-8s %s", "Owner", "Name", "Level", "WID", "Sharing"))
          print(String(repeating: "=", count: 110))

          var overlayLevel: Int = -1
          var overlayWID: Int = -1
          var overlaySharingState: Int = -1
          var maxAppLevel: Int = 0
          var maxAppName: String = ""

          let normalApps: Set<String> = ["Safari", "TextEdit", "Finder", "Google Chrome", "Firefox",
                                          "Safe Exam Browser", "SEB", "zoom.us", "Zoom"]

          for w in windows {
              let owner = w["kCGWindowOwnerName"] as? String ?? "?"
              let name = w["kCGWindowName"] as? String ?? "(untitled)"
              let level = w["kCGWindowLayer"] as? Int ?? 0
              let wid = w["kCGWindowNumber"] as? Int ?? 0
              let sharing = w["kCGWindowSharingState"] as? Int ?? -1

              let sharingLabel: String
              switch sharing {
              case 0: sharingLabel = "none"
              case 1: sharingLabel = "read-only"
              case 2: sharingLabel = "read-write"
              default: sharingLabel = "unknown(\(sharing))"
              }

              var marker = ""
              if owner.lowercased().contains("solvro") {
                  marker = " <<< OVERLAY"
                  overlayLevel = level
                  overlayWID = wid
                  overlaySharingState = sharing
              } else if normalApps.contains(owner) {
                  marker = " < APP"
                  if level > maxAppLevel {
                      maxAppLevel = level
                      maxAppName = owner
                  }
              }

              print(String(format: "%-28s %-35s %-12d %-8d %s%s",
                    owner as NSString, name as NSString, level, wid, sharingLabel, marker))
          }

          print("")
          print(String(repeating: "=", count: 60))
          print("  OVERLAY vs OTHER APPS - WINDOW LEVEL COMPARISON")
          print(String(repeating: "=", count: 60))

          guard overlayLevel >= 0 else {
              print("  Overlay window not found in CGWindowList.")
              print("  This can happen on CI if sharing=none hides it from the query.")
              print("  Falling back to log-based verification...")
              exit(2)
          }

          print("  Overlay window level:  \(overlayLevel)  (wid=\(overlayWID))")
          print("  Highest app level:     \(maxAppLevel)  (\(maxAppName.isEmpty ? "system" : maxAppName))")
          print("")

          let sebLevel = 1000
          print("  Reference levels:")
          print("    Normal apps (Chrome, Safari):  0")
          print("    Floating panels:               3")
          print("    Screen saver (SEB level):      \(sebLevel)")
          print("    Our overlay:                   \(overlayLevel)")
          print("")

          if overlayLevel > maxAppLevel {
              print("  PASS: Overlay (level \(overlayLevel)) is ABOVE all on-screen apps (max \(maxAppLevel))")
          } else {
              print("  FAIL: Overlay (level \(overlayLevel)) is NOT above apps (max \(maxAppLevel))")
              exit(1)
          }

          if overlayLevel > sebLevel {
              print("  PASS: Overlay (level \(overlayLevel)) is ABOVE Safe Exam Browser level (\(sebLevel))")
          } else {
              print("  FAIL: Overlay would NOT survive SEB (level \(sebLevel))")
              exit(1)
          }

          print("")
          print(String(repeating: "=", count: 60))
          print("  STEALTH CHECK - SCREEN CAPTURE VISIBILITY")
          print(String(repeating: "=", count: 60))

          if overlaySharingState == 0 {
              print("  PASS: Overlay sharing state = none (invisible to screen capture)")
          } else {
              print("  NOTE: Overlay sharing state = \(overlaySharingState)")
          }

          print("")
          print("All window-level checks passed")
          exit(0)
          SWIFTEOF

          swiftc /tmp/check_windows.swift -o /tmp/check_windows -framework Cocoa -framework CoreGraphics
          echo "Window checker compiled"

      - name: Launch Safari and TextEdit
        run: |
          echo "=== Launching Safari ==="
          open -a Safari https://www.example.com || echo "Safari launch returned non-zero (may still open)"
          sleep 4

          echo "=== Launching TextEdit ==="
          open -a TextEdit || echo "TextEdit launch returned non-zero"
          sleep 3

          echo "=== Apps launched ==="
          ps aux | grep -E "Safari|TextEdit" | grep -v grep || echo "(no matching processes)"

      - name: Launch overlay and verify z-order
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          BINARY="$APP_PATH/Contents/MacOS/solvro-overlay"

          echo "=== Launching overlay app ==="
          "$BINARY" > /tmp/overlay-stdout.log 2> /tmp/overlay-stderr.log &
          APP_PID=$!
          echo "Launched with PID: $APP_PID"
          sleep 6

          echo ""
          echo "=== Process alive check ==="
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ Process $APP_PID is running"
          else
            echo "❌ Process crashed!"
            cat /tmp/overlay-stderr.log
            exit 1
          fi

          echo ""
          echo "=== App stderr log ==="
          cat /tmp/overlay-stderr.log

          echo ""
          echo "========================================================"
          echo "  WINDOW Z-ORDER + STEALTH TEST"
          echo "========================================================"
          echo ""

          set +e
          /tmp/check_windows
          CHECK_EXIT=$?
          set -e

          echo ""
          echo "Window checker exit code: $CHECK_EXIT"

          if [ $CHECK_EXIT -eq 2 ]; then
            echo ""
            echo "========================================================"
            echo "  FALLBACK: LOG-BASED WINDOW LEVEL VERIFICATION"
            echo "========================================================"
            echo ""
            echo "CGWindowList unavailable (CI sandbox). Verifying from app's own logs..."
            echo ""

            # Parse the overlay's CGSBridge log line which prints the actual level set
            LEVEL_LINE=$(grep "CGSSetWindowLevel" /tmp/overlay-stderr.log || true)
            echo "Raw log: $LEVEL_LINE"

            if [ -n "$LEVEL_LINE" ]; then
              # Extract the level value (third number in the parentheses)
              OVERLAY_LEVEL=$(echo "$LEVEL_LINE" | grep -oE '[0-9]+' | tail -2 | head -1)
              CGS_RESULT=$(echo "$LEVEL_LINE" | grep -oE '[0-9]+' | tail -1)
              echo ""
              echo "  Overlay window level set to: $OVERLAY_LEVEL"
              echo ""
              echo "  Reference window levels:"
              echo "    Normal apps (Chrome, Safari, Firefox):  0"
              echo "    Floating panels:                        3"
              echo "    Torn-off menus:                         3"
              echo "    Modal panels:                           8"
              echo "    Utility windows:                        19"
              echo "    Dock:                                   20"
              echo "    Menu bar:                               24"
              echo "    Status bar:                             25"
              echo "    Screen saver / SEB:                     1000"
              echo "    kCGMaximumWindowLevel:                  2147483631"
              echo "    Our overlay (max + 1):                  $OVERLAY_LEVEL"
              echo ""

              if [ "$OVERLAY_LEVEL" -gt 1000 ] 2>/dev/null; then
                echo "  ✅ PASS: Overlay level $OVERLAY_LEVEL > SEB level 1000"
              else
                echo "  ❌ FAIL: Overlay level $OVERLAY_LEVEL is not above SEB"
                CHECK_EXIT=1
              fi

              if [ "$OVERLAY_LEVEL" -gt 0 ] 2>/dev/null; then
                echo "  ✅ PASS: Overlay level $OVERLAY_LEVEL > normal app level 0 (Safari, Chrome, etc.)"
              fi

              if [ "$OVERLAY_LEVEL" -gt 2147483631 ] 2>/dev/null; then
                echo "  ✅ PASS: Overlay level $OVERLAY_LEVEL > kCGMaximumWindowLevel (2147483631)"
                echo "         This means it renders ABOVE every possible macOS window"
              fi
            else
              echo "  ❌ No CGSSetWindowLevel log found"
              CHECK_EXIT=1
            fi

            # Check stealth from logs
            echo ""
            STEALTH_LINE=$(grep "stealth applied" /tmp/overlay-stderr.log || true)
            SHARING_LINE=$(grep "sharing" /tmp/overlay-stderr.log || true)
            if [ -n "$STEALTH_LINE" ]; then
              echo "  ✅ PASS: Stealth applied — $STEALTH_LINE"
            fi

            # Check that Safari and TextEdit are running (overlay co-exists)
            echo ""
            echo "  Apps running alongside overlay:"
            ps aux | grep -E "Safari|TextEdit" | grep -v grep | awk '{print "    " $11}' || echo "    (none)"

            if [ "$CHECK_EXIT" -ne 1 ]; then
              CHECK_EXIT=0
            fi
          fi

          echo ""
          echo "=== Taking screenshot ==="
          screencapture -x /tmp/overlay-screenshot.png 2>/dev/null && echo "Screenshot saved" || echo "Headless — no screenshot"

          echo ""
          echo "=== Cleanup ==="
          kill $APP_PID 2>/dev/null || true
          sleep 1
          killall Safari 2>/dev/null || true
          killall TextEdit 2>/dev/null || true

          if [ $CHECK_EXIT -ne 0 ]; then
            echo "❌ Window check failed"
            exit 1
          fi

          echo ""
          echo "✅ All tests passed — overlay launches on top of browsers and survives SEB-level windows"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-screenshot
          path: /tmp/overlay-screenshot.png
          if-no-files-found: ignore
