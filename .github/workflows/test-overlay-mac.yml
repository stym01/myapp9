name: Smoke Test macOS Overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  smoke-test:
    name: Build & Launch Test
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode:"
          xcodebuild -version

      - name: Build Release
        working-directory: ./myapp8/app_src/overlay-mac
        run: |
          xcodebuild \
            -project SolvroOverlay.xcodeproj \
            -scheme SolvroOverlay \
            -configuration Release \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            build 2>&1 | tail -5

      - name: Locate app bundle
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "solvro-overlay.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "App: $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/solvro-overlay"

      - name: Create mock token file
        run: |
          mkdir -p ~/Desktop
          echo "mock-test-token-for-ci" > ~/Desktop/solvro-token.txt

      - name: Build window-level checker tool
        run: |
          cat > /tmp/check_windows.swift << 'SWIFTEOF'
          import Cocoa
          import CoreGraphics

          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as? [[String: Any]] ?? []

          print("Total on-screen windows: \(windows.count)")
          print("")
          print(String(format: "%-28s %-35s %-12s %-8s %s", "Owner", "Name", "Level", "WID", "Sharing"))
          print(String(repeating: "=", count: 110))

          var overlayLevel: Int = -1
          var overlayWID: Int = -1
          var overlaySharingState: Int = -1
          var maxAppLevel: Int = 0
          var maxAppName: String = ""

          let normalApps = Set(["Safari", "TextEdit", "Finder", "Google Chrome", "Firefox",
                                "Safe Exam Browser", "SEB", "zoom.us", "Zoom"])

          for w in windows {
              let owner = w["kCGWindowOwnerName"] as? String ?? "?"
              let name = w["kCGWindowName"] as? String ?? "(untitled)"
              let level = w["kCGWindowLayer"] as? Int ?? 0
              let wid = w["kCGWindowNumber"] as? Int ?? 0
              let sharing = w["kCGWindowSharingState"] as? Int ?? -1

              let sharingLabel: String
              switch sharing {
              case 0: sharingLabel = "none"
              case 1: sharingLabel = "read-only"
              case 2: sharingLabel = "read-write"
              default: sharingLabel = "unknown(\(sharing))"
              }

              let marker: String
              if owner.lowercased().contains("solvro") {
                  marker = " ◄◄◄ OVERLAY"
                  overlayLevel = level
                  overlayWID = wid
                  overlaySharingState = sharing
              } else if normalApps.contains(owner) {
                  marker = " ◄ APP"
                  if level > maxAppLevel {
                      maxAppLevel = level
                      maxAppName = owner
                  }
              } else {
                  marker = ""
              }

              print(String(format: "%-28s %-35s %-12d %-8d %s%s", owner, name, level, wid, sharingLabel, marker))
          }

          print("")
          print(String(repeating: "=", count: 60))
          print("  OVERLAY vs OTHER APPS — WINDOW LEVEL COMPARISON")
          print(String(repeating: "=", count: 60))

          guard overlayLevel >= 0 else {
              print("❌ FAIL: No overlay window found on screen!")
              exit(1)
          }

          print("  Overlay window level:  \(overlayLevel)  (wid=\(overlayWID))")
          print("  Highest app level:     \(maxAppLevel)  (\(maxAppName.isEmpty ? "system" : maxAppName))")
          print("  Normal window level:   0")
          print("")

          // SEB (Safe Exam Browser) uses kCGScreenSaverWindowLevel (1000) or kCGMaximumWindowLevel
          // Our overlay sets level = CGWindowLevelForKey(.maximumWindow) + 1 = 2147483632
          // This is intentionally above everything including SEB
          let sebLevel = 1000  // kCGScreenSaverWindowLevel — where SEB typically sits
          print("  Reference levels:")
          print("    Normal apps (Chrome, Safari):  0")
          print("    Floating panels:               3")
          print("    Modal panels:                  8")
          print("    Screen saver (SEB level):      \(sebLevel)")
          print("    Our overlay:                   \(overlayLevel)")
          print("")

          if overlayLevel > maxAppLevel {
              print("  ✅ PASS: Overlay (level \(overlayLevel)) is ABOVE all on-screen apps (max \(maxAppLevel))")
          } else {
              print("  ❌ FAIL: Overlay (level \(overlayLevel)) is NOT above apps (max \(maxAppLevel))")
              exit(1)
          }

          if overlayLevel > sebLevel {
              print("  ✅ PASS: Overlay (level \(overlayLevel)) is ABOVE Safe Exam Browser level (\(sebLevel))")
          } else {
              print("  ❌ FAIL: Overlay would NOT survive SEB (level \(sebLevel))")
              exit(1)
          }

          print("")
          print(String(repeating: "=", count: 60))
          print("  STEALTH CHECK — SCREEN CAPTURE VISIBILITY")
          print(String(repeating: "=", count: 60))

          if overlaySharingState == 0 {
              print("  ✅ PASS: Overlay sharing state = none (invisible to screen capture)")
          } else if overlaySharingState == 1 {
              print("  ⚠️  Overlay sharing state = read-only")
          } else {
              print("  ⚠️  Overlay sharing state = \(overlaySharingState)")
          }

          print("")
          print("🏁 All window-level checks passed")
          exit(0)
          SWIFTEOF

          swiftc /tmp/check_windows.swift -o /tmp/check_windows -framework Cocoa -framework CoreGraphics
          echo "Window checker compiled"

      - name: Launch Safari and TextEdit
        run: |
          echo "=== Launching Safari ==="
          open -a Safari https://www.example.com || echo "Safari launch returned non-zero (may still open)"
          sleep 4

          echo "=== Launching TextEdit ==="
          open -a TextEdit || echo "TextEdit launch returned non-zero"
          sleep 3

          echo "=== Apps launched ==="
          ps aux | grep -E "Safari|TextEdit" | grep -v grep || echo "(no matching processes)"

      - name: Launch overlay and verify z-order
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          BINARY="$APP_PATH/Contents/MacOS/solvro-overlay"

          echo "=== Launching overlay app ==="
          "$BINARY" > /tmp/overlay-stdout.log 2> /tmp/overlay-stderr.log &
          APP_PID=$!
          echo "Launched with PID: $APP_PID"
          sleep 6

          echo ""
          echo "=== Process alive check ==="
          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ Process $APP_PID is running"
          else
            echo "❌ Process crashed!"
            cat /tmp/overlay-stderr.log
            exit 1
          fi

          echo ""
          echo "=== App stderr log ==="
          cat /tmp/overlay-stderr.log

          echo ""
          echo "========================================================"
          echo "  WINDOW Z-ORDER + STEALTH TEST"
          echo "========================================================"
          echo ""

          /tmp/check_windows
          CHECK_EXIT=$?

          echo ""
          echo "=== Taking screenshot ==="
          screencapture -x /tmp/overlay-screenshot.png 2>/dev/null && echo "Screenshot saved" || echo "Headless — no screenshot"

          echo ""
          echo "=== Cleanup ==="
          kill $APP_PID 2>/dev/null || true
          sleep 1
          killall Safari 2>/dev/null || true
          killall TextEdit 2>/dev/null || true

          if [ $CHECK_EXIT -ne 0 ]; then
            echo "❌ Window check failed"
            exit 1
          fi

          echo ""
          echo "✅ All tests passed — overlay launches on top of browsers and survives SEB-level windows"

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-screenshot
          path: /tmp/overlay-screenshot.png
          if-no-files-found: ignore
